name: WatchNext
options:
  bundleIdPrefix: com.madzine
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "15.0"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    GENERATE_INFOPLIST_FILE: YES
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 1.0.0

targets:
  WatchNext:
    type: application
    platform: macOS
    sources:
      - path: WatchNext
        excludes:
          - "**/.DS_Store"
    info:
      path: WatchNext/Info.plist
      properties:
        CFBundleIconFile: AppIcon.icns
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.madzine.WatchNext
        INFOPLIST_KEY_CFBundleDisplayName: "WatchNext"
        INFOPLIST_KEY_LSApplicationCategoryType: "public.app-category.entertainment"
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
        DEVELOPMENT_TEAM: ""
      configs:
        Debug:
          CODE_SIGN_IDENTITY: "-"
          CODE_SIGNING_REQUIRED: NO
        Release:
          CODE_SIGN_IDENTITY: "-"
          CODE_SIGNING_REQUIRED: NO
